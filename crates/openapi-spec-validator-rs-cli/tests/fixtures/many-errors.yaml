openapi: 3.0.3
info:
  title: Pets
  version: "1.0"
tags:
  - name: pets
  - name: pets
paths:
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ok
  /dogs:
    get:
      operationId: getPet
      responses:
        "200":
          description: ok
components:
  schemas:
    Pet:
      required: [id, name]
      allOf:
        - type: object
          properties:
            id:
              type: integer
    Limit:
      type: integer
      format: int32
      default: 9999999999
    Time:
      type: string
      format: time
      default: "25:00:00"
    Nullable:
      type: string
      default: null
