[package]
name = "openapi-spec-validator-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
include = ["src/**/*", "resources/**/*", "LICENSE", "NOTICE"]

[lib]
name = "openapi_spec_validator_rs"

[features]
default = ["http"]
# The built-in client that fetches `http(s)://` `$ref` targets, as upstream does.
# Without it, `Options::default()` resolves no remote references; a `Retrieve`
# implementation can still be supplied.
http = ["dep:ureq"]

[dependencies]
base64.workspace = true
fancy-regex.workspace = true
jsonschema.workspace = true
percent-encoding.workspace = true
referencing.workspace = true
serde_json.workspace = true
thiserror.workspace = true
unsafe-libyaml.workspace = true
ureq = { workspace = true, optional = true }
url.workspace = true
