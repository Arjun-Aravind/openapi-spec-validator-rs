name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UPSTREAM_VERSION: "0.9.0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  python:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the reference implementation's test suite
        run: git clone --depth 1 --branch "$UPSTREAM_VERSION" https://github.com/python-openapi/openapi-spec-validator upstream
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest "openapi-spec-validator==$UPSTREAM_VERSION"
          python -m pip install -e . -v
      - name: Python API tests
        run: python -m pytest --deselect tests/test_upstream_suite.py::test_upstream_suite
      # Upstream's own tests through the `openapi_spec_validator` shim; expected failures
      # are listed with their reasons in tests/upstream_shim/upstream_suite.py.
      - name: Upstream test suite (network tests deselected)
        run: python tests/run_upstream_suite.py -m "not network" -rxX
